<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Solitaire — classic Klondike, playable in the browser">
  <defs>
    <linearGradient id="felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f16"/>
      <stop offset="45%" stop-color="#081209"/>
      <stop offset="100%" stop-color="#0a1610"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="92%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="8%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#b5122e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b5122e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3ecd7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3ecd7"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1e3326" stroke-width="1" opacity="0.4"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="280" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#felt)"/>
    <rect width="1200" height="280" fill="url(#glowGold)"/>
    <rect width="1200" height="280" fill="url(#glowGreen)"/>
    <rect width="1200" height="280" fill="url(#glowRed)"/>
    <rect width="1200" height="280" fill="url(#grid)" opacity="0.5"/>

    <ellipse cx="600" cy="300" rx="520" ry="120" fill="#d4af37" opacity="0.04"/>
    <ellipse cx="980" cy="40" rx="180" ry="80" fill="#2ecc71" opacity="0.05"/>

    <text x="600" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="2" fill="url(#titleGrad)">Solitaire</text>
    <text x="600" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#a99e93">Classic Klondike, playable right in your browser</text>

    <rect x="330" y="182" width="540" height="2" rx="1" fill="#2a2418"/>
    <rect x="430" y="182" width="340" height="2" rx="1" fill="#d4af37" opacity="0.7">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#a99e93">
      <text x="600" y="218" text-anchor="middle">Drag &amp; drop · 4 deck styles · Missions · No install, no build step</text>
      <text x="600" y="244" text-anchor="middle" fill="#d4af37" opacity="0.9">Zero dependencies · Runs entirely in the browser</text>
    </g>

    <text x="108" y="82" font-size="20" fill="#d4af37" opacity="0.7">♠
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="1078" y="212" font-size="16" fill="#b5122e" opacity="0.7">♥
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="228" font-size="15" fill="#2ecc71" opacity="0.6">♣
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="1040" y="64" font-size="17" fill="#b5122e" opacity="0.6">♦
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
