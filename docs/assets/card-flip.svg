<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Animated diagram: a playing card flipping from its back to reveal the Ace of Spades">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2454"/>
      <stop offset="100%" stop-color="#101a3d"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="18" fill="#081209"/>

  <!-- drifting ambient suit particles, echoing the in-app background -->
  <g font-family="Segoe UI, Arial, sans-serif" fill="#d4af37" opacity="0.5">
    <text x="34" y="200" font-size="16">
      <animate attributeName="y" values="210;10" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="6s" repeatCount="indefinite"/>
      ♠
    </text>
    <text x="270" y="190" font-size="14" fill="#b5122e">
      <animate attributeName="y" values="205;15" dur="7.5s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.85;1" dur="7.5s" begin="-2s" repeatCount="indefinite"/>
      ♥
    </text>
    <text x="60" y="180" font-size="12" fill="#2ecc71">
      <animate attributeName="y" values="200;20" dur="8.5s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.1;0.85;1" dur="8.5s" begin="-4s" repeatCount="indefinite"/>
      ♣
    </text>
  </g>

  <g transform="translate(160,110)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1;0.06,1;-1,1;-0.06,1;1,1" keyTimes="0;0.25;0.5;0.75;1" dur="5s" repeatCount="indefinite"/>

      <!-- card back -->
      <g>
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.24;0.26;0.74;0.76;1" dur="5s" repeatCount="indefinite"/>
        <rect x="-58" y="-80" width="116" height="160" rx="12" fill="url(#backGrad)" stroke="#d4af37" stroke-width="2.5"/>
        <path d="M-58,-80 L58,80 M58,-80 L-58,80" stroke="#d4af37" stroke-opacity="0.18" stroke-width="10"/>
        <text x="0" y="12" text-anchor="middle" font-size="40" fill="#d4af37" fill-opacity="0.55" font-family="Segoe UI, Arial, sans-serif">&#9824;</text>
      </g>

      <!-- card face: Ace of Spades -->
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.74;0.76;1" dur="5s" repeatCount="indefinite"/>
        <rect x="-58" y="-80" width="116" height="160" rx="12" fill="#fdfdfd" stroke="#ccc" stroke-width="1.5"/>
        <text x="-42" y="-52" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">A♠</text>
        <text x="42" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" transform="rotate(180 42 66)">A♠</text>
        <text x="0" y="26" text-anchor="middle" font-size="58" fill="#1a1a1a" font-family="Segoe UI, Arial, sans-serif">&#9824;</text>
      </g>
    </g>
  </g>
</svg>
