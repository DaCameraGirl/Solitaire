<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solitaire</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ambient-particles"></div>

  <header>
    <h1>Solitaire</h1>
    <div class="controls">
      <span id="move-count">Moves: 0</span>
      <button id="music-toggle-btn">🎵 Music</button>
      <button id="new-game-btn">New Game</button>
    </div>
  </header>

  <div class="toolbar">
    <label>
      Table:
      <select id="table-select">
        <option value="green">Green Felt</option>
        <option value="purple">Purple</option>
        <option value="navy">Navy</option>
        <option value="burgundy">Burgundy</option>
        <option value="charcoal">Charcoal</option>
      </select>
    </label>
    <label>
      Deck:
      <select id="deck-select">
        <option value="classic">Classic</option>
        <option value="royal">Royal</option>
        <option value="minimal">Minimalist</option>
        <option value="neon">Neon</option>
      </select>
    </label>
    <label>
      Mission:
      <select id="mission-select">
        <option value="none">Free Play</option>
        <option value="speed">Speed Run (under 60 moves)</option>
        <option value="noredraw">No Redraw (never recycle the waste)</option>
        <option value="acerush">Ace Rush (all 4 Aces home by move 15)</option>
      </select>
    </label>
    <span id="mission-status"></span>
  </div>

  <main>
    <div class="top-row">
      <div class="stock-waste">
        <div id="stock" class="pile stock"></div>
        <div id="waste" class="pile waste"></div>
      </div>
      <div id="foundations" class="foundations">
        <div class="pile foundation" data-suit="spades"></div>
        <div class="pile foundation" data-suit="hearts"></div>
        <div class="pile foundation" data-suit="clubs"></div>
        <div class="pile foundation" data-suit="diamonds"></div>
      </div>
    </div>

    <div id="tableau" class="tableau"></div>
  </main>

  <div id="win-overlay" class="win-overlay hidden">
    <div class="win-message">
      <h2>You Win! 🎉</h2>
      <p id="win-stats"></p>
      <button id="win-new-game-btn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
